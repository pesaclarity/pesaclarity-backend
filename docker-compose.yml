# Local development only. Secrets here are placeholders; never reuse them anywhere real.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ngome
      POSTGRES_PASSWORD: ngome
      POSTGRES_DB: ngome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngome -d ngome"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      NGOME_DATABASE_URL: postgresql+asyncpg://ngome:ngome@db:5432/ngome
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      NGOME_DATABASE_URL: postgresql+asyncpg://ngome:ngome@db:5432/ngome
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
