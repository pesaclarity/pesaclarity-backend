# Local development only. Secrets here are placeholders; never reuse them anywhere real.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ngome
      POSTGRES_PASSWORD: ngome
      POSTGRES_DB: ngome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngome -d ngome"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Official MinIO images are no longer published on Docker Hub; this is a maintained community
  # build of the same server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ngome-dev
      MINIO_ROOT_PASSWORD: ngome-dev-only-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: pgsty/mc:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 ngome-dev ngome-dev-only-secret
        && mc mb --ignore-existing local/ngome-backups local/ngome-test
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    build: .
    env_file: .env
    environment:
      NGOME_DATABASE_URL: postgresql+asyncpg://ngome:ngome@db:5432/ngome
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      NGOME_DATABASE_URL: postgresql+asyncpg://ngome:ngome@db:5432/ngome
      NGOME_VAULT_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
