name: PR title

# Release notes and version numbers come from pull request titles (squash
# merges keep the title as the commit message), so every title must follow
# Conventional Commits: "feat: ...", "fix: ...", "feat!: ..." for a breaking
# change, or another type below that does not change the version.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::Start the title with a type, e.g. 'feat: add debts screen', 'fix: keep footers out of rows' or 'feat!: change the backup format'. Types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert, style."
            exit 1
          fi
