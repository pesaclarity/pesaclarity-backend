name: Deploy to Cloud Run

# Deploys main to Google Cloud Run (EU) once CI passes, or by hand from the
# Actions tab. Skipped until the GCP_PROJECT_ID variable is set; see README,
# "Deploying to Cloud Run", for the one-time setup.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless sign-in to Google Cloud

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  SERVICE: ngome-api
  RUNTIME_SA: ngome-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  # Values from Secret Manager, as ENV=secret-name:version.
  SECRETS: >-
    NGOME_DATABASE_URL=ngome-database-url:latest,NGOME_JWT_SECRET=ngome-jwt-secret:latest,NGOME_CONTACT_PEPPER=ngome-contact-pepper:latest,NGOME_SMTP_PASSWORD=ngome-smtp-password:latest,NGOME_VAULT_S3_ACCESS_KEY_ID=ngome-s3-access-key-id:latest,NGOME_VAULT_S3_SECRET_ACCESS_KEY=ngome-s3-secret-access-key:latest

jobs:
  deploy:
    name: Build, migrate and release
    if: >-
      vars.GCP_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ngome-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        id: image
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT/ngome/ngome:${GITHUB_SHA::12}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --provenance=false -t "$image" .
          docker push "$image"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      - name: Write the service settings
        env:
          EMAIL_FROM: ${{ vars.NGOME_EMAIL_FROM }}
          SMTP_HOST: ${{ vars.NGOME_SMTP_HOST || 'smtp-relay.brevo.com' }}
          SMTP_USERNAME: ${{ vars.NGOME_SMTP_USERNAME }}
          S3_BUCKET: ${{ vars.NGOME_VAULT_S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ vars.NGOME_VAULT_S3_ENDPOINT_URL }}
          GOOGLE_CLIENT_IDS: ${{ vars.NGOME_GOOGLE_CLIENT_IDS || '[]' }}
        run: |
          google_enabled=false
          [ "$GOOGLE_CLIENT_IDS" != "[]" ] && google_enabled=true
          # YAML strings, so values with spaces, quotes or brackets pass through intact.
          q() { printf '"%s"' "$(printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g')"; }
          {
            echo "NGOME_ENVIRONMENT: production"
            echo "NGOME_LOG_JSON: \"true\""
            echo "NGOME_EMAIL_PROVIDER: smtp"
            echo "NGOME_EMAIL_FROM: $(q "$EMAIL_FROM")"
            echo "NGOME_SMTP_HOST: $(q "$SMTP_HOST")"
            echo "NGOME_SMTP_USERNAME: $(q "$SMTP_USERNAME")"
            echo "NGOME_VAULT_BLOB_STORE: s3"
            echo "NGOME_VAULT_S3_BUCKET: $(q "$S3_BUCKET")"
            echo "NGOME_VAULT_S3_ENDPOINT_URL: $(q "$S3_ENDPOINT_URL")"
            echo "NGOME_VAULT_S3_REGION: auto"
            echo "NGOME_GOOGLE_SIGN_IN_ENABLED: \"$google_enabled\""
            echo "NGOME_GOOGLE_CLIENT_IDS: $(q "$GOOGLE_CLIENT_IDS")"
            # Cloud Run's front end is the only thing that can reach the container.
            echo "FORWARDED_ALLOW_IPS: \"*\""
          } > "$RUNNER_TEMP/env.yaml"

      # Migrations run as a Cloud Run job first; the new revision goes live only if they pass.
      - name: Migrate the database
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          gcloud run jobs deploy ngome-migrate --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --command alembic --args upgrade,head \
            --service-account "$RUNTIME_SA" --env-vars-file "$RUNNER_TEMP/env.yaml" \
            --set-secrets "$SECRETS" --max-retries 0 --task-timeout 5m --quiet
          gcloud run jobs execute ngome-migrate --project "$PROJECT" --region "$REGION" --wait

      - name: Release the API
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --port 8000 --allow-unauthenticated \
            --service-account "$RUNTIME_SA" --env-vars-file "$RUNNER_TEMP/env.yaml" \
            --set-secrets "$SECRETS" --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 3 --concurrency 40 --quiet

      # The daily retention purge runs the same image; Cloud Scheduler triggers it.
      - name: Update the purge job
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          gcloud run jobs deploy ngome-purge --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --command ngome-purge \
            --service-account "$RUNTIME_SA" --env-vars-file "$RUNNER_TEMP/env.yaml" \
            --set-secrets "$SECRETS" --max-retries 1 --task-timeout 10m --quiet

      - name: Check health
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" \
            --region "$REGION" --format 'value(status.url)')"
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$url/health/ready"
