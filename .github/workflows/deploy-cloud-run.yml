name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  IMAGE_REPO: ${{ vars.GCP_IMAGE }}
  RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  MIGRATE_JOB: ${{ vars.CLOUD_RUN_MIGRATE_JOB }}
  PURGE_JOB: ${{ vars.CLOUD_RUN_PURGE_JOB }}
  SERVICE_FLAGS: ${{ vars.CLOUD_RUN_SERVICE_FLAGS }}
  JOB_FLAGS: ${{ vars.CLOUD_RUN_JOB_FLAGS }}

jobs:
  deploy:
    name: Build, migrate and release
    if: >-
      vars.GCP_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=""
          for name in PROJECT REGION IMAGE_REPO RUNTIME_SA SERVICE MIGRATE_JOB PURGE_JOB \
            SERVICE_FLAGS JOB_FLAGS WIF_PROVIDER DEPLOY_SA; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables for:$missing (see README)"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Before the build, so a missing service fails fast.
      - name: Read the service settings
        id: settings
        run: |
          secrets="$(tool/cloud_run_settings.sh "$PROJECT" "$REGION" "$SERVICE" "$RUNNER_TEMP/env.json")"
          echo "secrets=$secrets" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        id: image
        run: |
          image="$IMAGE_REPO:${GITHUB_SHA::12}"
          gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet
          docker build --provenance=false -t "$image" .
          docker push "$image"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      # Migrations run as a Cloud Run job first; the new revision goes live only if they pass.
      - name: Migrate the database
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          SECRETS: ${{ steps.settings.outputs.secrets }}
        run: |
          # shellcheck disable=SC2086 # the flags variable holds several flags
          gcloud run jobs deploy "$MIGRATE_JOB" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --command alembic --args upgrade,head \
            --service-account "$RUNTIME_SA" --env-vars-file "$RUNNER_TEMP/env.json" \
            --set-secrets "$SECRETS" $JOB_FLAGS --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --project "$PROJECT" --region "$REGION" --wait

      - name: Release the API
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          # No env or secret flags: those would replace the settings on the service.
          # shellcheck disable=SC2086
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SA" $SERVICE_FLAGS --quiet

      # The daily retention purge runs the same image; Cloud Scheduler triggers it.
      - name: Update the purge job
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          SECRETS: ${{ steps.settings.outputs.secrets }}
        run: |
          # shellcheck disable=SC2086
          gcloud run jobs deploy "$PURGE_JOB" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --command ngome-purge \
            --service-account "$RUNTIME_SA" --env-vars-file "$RUNNER_TEMP/env.json" \
            --set-secrets "$SECRETS" $JOB_FLAGS --quiet

      - name: Check health
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" \
            --region "$REGION" --format 'value(status.url)')"
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$url/health/ready"
