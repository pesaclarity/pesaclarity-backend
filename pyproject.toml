[project]
name = "ngome"
version = "0.2.0"
description = "Pesa Clarity server: sign-in, zero-knowledge backup vault and federated-learning aggregation."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiobotocore>=3.10.0",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    # 5.9 is the newest cbor2 that installs on an Intel Mac without a Rust build: 6.x ships
    # no macosx x86_64 wheel, 5.9 still ships a pure-Python one. 5.9.0 also fixes
    # CVE-2025-68131 and CVE-2026-26209, so nothing older will do.
    "cbor2>=5.9.0,<6",
    "email-validator>=2.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "maxminddb>=3.3.0",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=2.7.1",
]

[project.optional-dependencies]
fl = [
    "flwr>=1.32.1",
]

[project.scripts]
ngome-purge = "ngome.auth.retention:main"
ngome-app-status-key = "ngome.appstatus.signing:main"
ngome-licence-key = "ngome.groupsync.licence:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngome"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=1.19.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
    "types-aiobotocore[s3]>=3.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "T20", "N", "C4", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "object_storage: needs an S3-compatible endpoint (skipped unless NGOME_TEST_S3_ENDPOINT_URL is set)",
    "postgres: needs an empty Postgres database (skipped unless NGOME_TEST_DATABASE_URL is set)",
]
